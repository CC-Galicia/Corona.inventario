<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="InvTrack Pro">
<meta name="theme-color" content="#00e5a0">
<title>Catálogo · InvTrack Pro</title>
<link rel="stylesheet" href="shared.css">

<style>
  #cp-loader{position:fixed;inset:0;background:var(--bg,#080b10);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;gap:18px;transition:opacity .35s ease;}
  #cp-loader.hide{opacity:0;pointer-events:none;}
  #cp-loader .cp-logo{width:84px;height:84px;background:linear-gradient(135deg,#00e5a0,#0094ff);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 10px 50px rgba(0,229,160,.35);animation:cpFloat 2.4s ease-in-out infinite;}
  #cp-loader .cp-ti{font-family:Syne,sans-serif;font-size:24px;font-weight:800;color:#eef0f5;letter-spacing:.3px;}
  #cp-loader .cp-su{font-size:13px;color:#8a94a8;}
  #cp-loader .cp-bar{width:180px;height:5px;background:#181e2c;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);}
  #cp-loader .cp-fill{height:100%;width:0%;background:linear-gradient(90deg,#00e5a0,#0094ff);border-radius:3px;transition:width .35s ease;box-shadow:0 0 14px rgba(0,229,160,.55);}
  #cp-loader .cp-step{font-size:11px;color:#6c7689;letter-spacing:.4px;text-transform:uppercase;}
  @keyframes cpFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  body.cp-loading > *:not(#cp-loader){visibility:hidden;}
</style>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>
</head>
<body>
<div id="cp-loader">
  <div class="cp-logo">📦</div>
  <div class="cp-ti">Catálogo</div>
  <div class="cp-su">Sincronizando con la nube 🔥</div>
  <div class="cp-bar"><div class="cp-fill" id="cp-fill"></div></div>
  <div class="cp-step" id="cp-step">Conectando...</div>
</div>
<!-- ══════ CATALOG (operator) ══════ -->
<div id="screen-catalog" class="screen active">
  <div class="tb"><button class="bk" onclick="goBack()">←</button>
    <div><div class="tb-ti">Catálogo</div><div class="tb-su">Stock de SAP</div></div>
  </div>
  <div class="sa">
    <div class="sh"><div class="sh-t">Cargar Excel</div>
      <div class="sh-s">Columnas: <b>Material · Texto breve · Ubicación · Stock total</b><br>Referencias duplicadas en la misma ubicación se suman automáticamente.</div>
    </div>
    <div class="upload-area mt10" ondragover="event.preventDefault()" ondrop="handleDrop(event,'op')">
      <input type="file" accept=".xlsx,.xls,.csv" onchange="loadCatalog(this.files[0],'op')">
      <div style="font-size:34px;margin-bottom:10px;">📊</div>
      <div style="font-family:var(--fh);font-size:15px;font-weight:700;margin-bottom:4px;">Toca para seleccionar archivo</div>
      <div style="font-size:13px;color:var(--tx2);">.xlsx · .xls · .csv exportado de SAP</div>
    </div>
    <div id="op-cat-preview" class="mt10"></div>
    <div id="op-cat-list"></div>
    <div id="op-cat-clear" style="display:none;margin-top:10px;">
      <button class="btn bd2" onclick="clearCatalog('op')">🗑 Eliminar TODOS mis catálogos propios</button>
    </div>
    <!-- Auditoría Selectiva: solo visible para el admin en su propio catálogo -->
    <div id="op-cat-audit-wrap" style="display:none;margin-top:8px;">
      <button class="btn b-pu" onclick="openSelfSelectiveAudit()">🎯 Auditoría Selectiva — elegir ubicaciones</button>
    </div>
  </div>
</div>
<script src="shared.js"></script>
<script>
window.__startupMode = 'catalog';
(function(){
  document.body.classList.add('cp-loading');
  var pct = 0, steps = ['Conectando...','Autenticando...','Descargando catálogos...','Casi listo...'];
  var si = 0;
  var iv = setInterval(function(){
    pct = Math.min(pct + Math.random()*9 + 3, 88);
    var f = document.getElementById('cp-fill'); if(f) f.style.width = pct+'%';
    var s = document.getElementById('cp-step'); if(s && si<steps.length-1 && pct>22*(si+1)) s.textContent = steps[++si];
  }, 320);
  window.__cpFinish = function(){
    clearInterval(iv);
    var f = document.getElementById('cp-fill'); if(f) f.style.width = '100%';
    var s = document.getElementById('cp-step'); if(s) s.textContent = 'Listo';
    setTimeout(function(){
      var l = document.getElementById('cp-loader'); if(l) l.classList.add('hide');
      document.body.classList.remove('cp-loading');
      setTimeout(function(){ if(l) l.remove(); }, 400);
    }, 250);
  };
})();

window.__startCatalogPage = function(s){
  // Operator catalog page (also used by admin's "Mi Catálogo")
  try{
    var db = getDB();
    if(!s || (s.username !== '__master__' && !(db.users && db.users[s.username]))){
      window.location.href = 'app.html'; return;
    }
    window.CUR = s;
    window.CFG = db.settings || {vibrate:true, confirmClose:true};
    if(typeof purgeAllExpiredCatalogs==='function') purgeAllExpiredCatalogs();
    // Override goBack to leave the standalone page
    window.goBack = function(){ window.location.href = 'app.html'; };
    window.goHome = function(){ window.location.href = 'app.html'; };
    if(typeof stopAll==='function') stopAll();
    if(typeof showScr==='function') showScr('catalog');
    var prev = document.getElementById('op-cat-preview'); if(prev) prev.innerHTML='';
    if(typeof renderOwnCatList==='function') renderOwnCatList();
    // Admin/master see audit button on their own catalog
    var isAdmin = (s.role==='admin' || s.role==='master');
    var hasCat  = (typeof getCatalog==='function') && !!getCatalog(s.username);
    var aw = document.getElementById('op-cat-audit-wrap');
    if(aw) aw.style.display = (hasCat && isAdmin) ? '' : 'none';
  }catch(e){ console.error(e); }
  window.__cpFinish && window.__cpFinish();
};

window.__startCatalogosPage = function(s){
  // Admin/master only
  try{
    if(!s || (s.role!=='admin' && s.role!=='master')){
      window.location.href = 'app.html'; return;
    }
    var db = getDB();
    if(s.username !== '__master__' && !(db.users && db.users[s.username])){
      window.location.href = 'app.html'; return;
    }
    window.CUR = s;
    window.CFG = db.settings || {vibrate:true, confirmClose:true};
    if(typeof purgeAllExpiredCatalogs==='function') purgeAllExpiredCatalogs();
    window.goBack = function(){ window.location.href = 'app.html'; };
    window.goHome = function(){ window.location.href = 'app.html'; };
    if(typeof stopAll==='function') stopAll();
    if(typeof showScr==='function') showScr('a-catalog');
    if(typeof renderAdminCatalog==='function') renderAdminCatalog();
  }catch(e){ console.error(e); }
  window.__cpFinish && window.__cpFinish();
};

// Hide the default fb-loading from shared.js the moment it appears (we use our own).
(function watchFb(){
  var t = setInterval(function(){
    var fb = document.getElementById('fb-loading');
    if(fb){ fb.style.display='none'; clearInterval(t); }
  }, 50);
  setTimeout(function(){ clearInterval(t); }, 5000);
})();
</script>
</body>
</html>
