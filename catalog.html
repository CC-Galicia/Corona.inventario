<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Catálogo · InvTrack">
<meta name="theme-color" content="#00e5a0">
<title>Catálogo · InvTrack Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080b10; --bg2:#0c1119; --tx:#eef0f5; --tx2:#8a94a8; --tx3:#5d6678;
    --ac:#00e5a0; --ac2:#0094ff; --sf:#11161f; --sf2:#181e2c; --bd:#1f2738;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  body{position:relative;}

  /* ── IFRAME del catálogo ── */
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg);opacity:0;transition:opacity .55s ease;pointer-events:none;}
  body.ready #frame{opacity:1;pointer-events:auto;}

  /* ── OVERLAY de carga ── */
  #loader{
    position:fixed;inset:0;z-index:50;
    background:
      radial-gradient(1100px 700px at 20% 0%, rgba(0,148,255,.22), transparent 60%),
      radial-gradient(900px 700px at 100% 100%, rgba(0,229,160,.18), transparent 60%),
      linear-gradient(180deg, #060910 0%, #0b1320 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
    padding:32px;text-align:center;
    transition:opacity .45s ease, visibility .45s ease;
  }
  body.ready #loader{opacity:0;visibility:hidden;}

  /* Halo animado detrás del logo */
  .halo{position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(60px);opacity:.55;
    background:conic-gradient(from 0deg, #00e5a0, #0094ff, #b46cff, #00e5a0);
    animation:spin 9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .badge{
    position:relative;width:96px;height:96px;border-radius:28px;
    background:linear-gradient(135deg,#00e5a0,#0094ff);
    display:flex;align-items:center;justify-content:center;font-size:44px;
    box-shadow:0 20px 60px rgba(0,229,160,.35), 0 0 0 1px rgba(255,255,255,.06) inset;
    animation:float 3.6s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

  .title{position:relative;font-family:'Syne',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.01em;}
  .title .grad{background:linear-gradient(90deg,#00e5a0,#0094ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .subtitle{position:relative;color:var(--tx2);font-size:14px;max-width:300px;line-height:1.5;}
  .stage{position:relative;display:flex;align-items:center;gap:10px;color:var(--tx3);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 12px var(--ac);animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}

  /* Barra de progreso */
  .progress{position:relative;width:min(320px,80vw);height:8px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;border:1px solid rgba(255,255,255,.04);}
  .progress .fill{position:absolute;inset:0;width:0%;border-radius:99px;background:linear-gradient(90deg,#00e5a0,#0094ff,#b46cff);background-size:200% 100%;animation:shimmer 1.8s linear infinite;transition:width .35s ease;}
  @keyframes shimmer{to{background-position:-200% 0;}}
  .pct{position:relative;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:var(--tx2);letter-spacing:.02em;}

  .steps{position:relative;display:flex;gap:18px;margin-top:4px;}
  .step{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx3);font-weight:600;}
  .step .tick{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--tx3);display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent;transition:all .3s;}
  .step.done{color:var(--ac);}
  .step.done .tick{background:var(--ac);border-color:var(--ac);color:#001b12;}
  .step.done .tick::after{content:'✓';font-weight:900;}

  /* Mensaje de error / sin sesión */
  .err{display:none;position:relative;margin-top:12px;background:rgba(255,77,109,.08);border:1px solid rgba(255,77,109,.3);border-radius:14px;padding:14px 18px;max-width:340px;}
  .err b{color:#ff8aa3;font-family:'Syne',sans-serif;font-size:14px;display:block;margin-bottom:4px;}
  .err p{font-size:12.5px;color:var(--tx2);line-height:1.5;}
  .err a{display:inline-block;margin-top:10px;background:linear-gradient(135deg,#00e5a0,#0094ff);color:#001b12;text-decoration:none;font-weight:800;font-size:13px;padding:9px 16px;border-radius:10px;}
  body.error .err{display:block;}
  body.error .progress,body.error .stage,body.error .steps{display:none;}

  .credit{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase;}
</style>
</head>
<body>

<iframe id="frame" title="Panel Catálogo" allow="camera; microphone"></iframe>

<div id="loader" role="status" aria-live="polite">
  <div class="halo"></div>
  <div class="badge">📦</div>
  <div class="title"><span class="grad">Catálogo</span> · InvTrack Pro</div>
  <div class="subtitle" id="msg">Conectando con la nube y sincronizando tus referencias SAP…</div>

  <div class="progress"><div class="fill" id="fill"></div></div>
  <div class="pct" id="pct">0%</div>

  <div class="steps" id="steps">
    <div class="step" id="s1"><span class="tick"></span>Conectar</div>
    <div class="step" id="s2"><span class="tick"></span>Sesión</div>
    <div class="step" id="s3"><span class="tick"></span>Catálogo</div>
  </div>

  <div class="stage" id="stage"><span class="dot"></span><span id="stage-txt">Iniciando…</span></div>

  <div class="err">
    <b>Necesitas iniciar sesión</b>
    <p>El panel de Catálogo requiere una sesión activa. Vuelve al inicio y entra con tu cuenta.</p>
    <a href="app.html">← Volver al inicio</a>
  </div>

  <div class="credit">© 2026 Jose Pérez · InvTrack Pro</div>
</div>

<script>
(function(){
  var frame   = document.getElementById('frame');
  var fill    = document.getElementById('fill');
  var pctEl   = document.getElementById('pct');
  var stageTx = document.getElementById('stage-txt');
  var msg     = document.getElementById('msg');
  var s1=document.getElementById('s1'), s2=document.getElementById('s2'), s3=document.getElementById('s3');

  var pct = 0, target = 8, done = false;
  function setPct(p){ pct = Math.min(p, 99); fill.style.width = pct+'%'; pctEl.textContent = Math.round(pct)+'%'; }
  function setStage(t){ stageTx.textContent = t; }

  // Progreso suave sintético hasta recibir señales del iframe
  var tick = setInterval(function(){
    if(done) return;
    if(pct < target) setPct(pct + Math.max(.4, (target-pct)*0.08));
  }, 90);

  // Etapas
  setStage('Cargando motor…');
  s1.classList.add('done');
  target = 30;

  frame.addEventListener('load', function(){
    setStage('Conectando con Firebase…');
    target = 55;
  });

  window.addEventListener('message', function(ev){
    var d = ev.data || {};
    if(d.type === 'catalog-ready'){
      s2.classList.add('done'); s3.classList.add('done');
      setStage('¡Listo!'); target = 100; setPct(100);
      done = true;
      setTimeout(function(){
        document.body.classList.add('ready');
        setTimeout(function(){ var l=document.getElementById('loader'); if(l) l.remove(); }, 600);
      }, 280);
    } else if(d.type === 'catalog-no-session'){
      done = true; clearInterval(tick);
      document.body.classList.add('error');
      setStage('Sin sesión');
    } else if(d.type === 'catalog-back'){
      // Volver al inicio (operador)
      if(history.length > 1) history.back();
      else location.href = 'app.html';
    } else if(d.type === 'catalog-timeout'){
      done = true; clearInterval(tick);
      msg.textContent = 'La sincronización está tardando más de lo normal. Revisa tu conexión y reintenta.';
      document.body.classList.add('error');
    }
  });

  // Cuando el iframe pasa de "conectado" a "listo", marcamos sesión
  // (señal intermedia: cuando window.CUR ya existe dentro del iframe)
  var checkSession = setInterval(function(){
    try{
      var w = frame.contentWindow;
      if(w && w.CUR && w.CUR.username){
        s2.classList.add('done');
        if(target < 80){ target = 80; setStage('Cargando tu catálogo…'); }
        clearInterval(checkSession);
      }
    }catch(e){ /* cross-origin no debería pasar (mismo origen) */ }
  }, 250);

  // Lanzar el iframe
  frame.src = 'app.html?embed=catalog';
})();
</script>
</body>
</html>
